name: Notificar Falha na Esteira

on:
  workflow_run:
    workflows: ["Esteira CI/CD"]
    types:
      - completed

permissions:
  issues: write

jobs:
  notificar:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' }}
    steps:
      - name: Abrir Issue de Falha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          gh issue create \
            --title "Pipeline Quebrada na Main" \
            --body "A execução da **Esteira CI/CD** falhou na branch \`main\`.\n\nLink da execução: $RUN_URL" \
            --label "pipeline-quebrada"